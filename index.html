<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pizzeria">
<title>Pizzeria</title>
<style>
:root{--bg:#f2f2f5;--card:#fff;--fg:#111;--mut:#777;--in:#eceff3;--ac:#34c759;--bt:#dcdce2;--ln:#d6d6dc;box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--card:#1c1c1e;--fg:#fff;--mut:#98989f;--in:#0b0b0c;--bt:#3a3a3c;--ln:#38383a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:17px -apple-system,Helvetica,Arial,sans-serif;display:flex;gap:12px;padding:12px;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;border-radius:26px;background:var(--bt);padding:12px 16px;cursor:pointer;font-weight:600}
button.g{background:var(--ac);color:#fff}button.s{padding:6px 12px;font-size:15px}
input,textarea{width:100%;background:var(--in);border:0;border-radius:10px;padding:12px;margin:0}
.p{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0}
#Lc{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}#Rc{width:450px;display:flex;flex-direction:column;gap:12px;min-height:0}#L{flex:1}#R{flex:1}
#sbar{background:var(--card);border-radius:14px;padding:14px 16px;color:var(--mut);font-size:20px;max-width:460px;width:100%;margin:0 auto;cursor:pointer}
.hdr{font-size:20px;font-weight:700;margin:14px 4px 2px}.d.sel{background:rgba(52,199,89,.14)}.d .c{color:var(--ac);font-weight:700;margin-left:auto;margin-right:10px}
.d b{display:inline-block;width:56px;color:var(--fg)}.d{font-size:19px;align-items:center}.ic{display:flex;gap:6px;align-items:center}.gr{color:var(--ac);font-size:15px}
#mA,#mL{height:54px;font-size:20px}.fb{padding:15px 16px;text-align:left;font-weight:400;border-radius:10px;background:var(--in);color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button.on{background:var(--ac);color:#fff}
#list{overflow:auto;flex:1}
.d{display:flex;justify-content:space-between;gap:8px;padding:14px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.d b{color:var(--mut);margin-right:8px}.l{padding:8px 0;border-bottom:1px solid var(--ln)}
.r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.m{color:var(--mut);font-size:14px}.sum{font-size:32px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:stretch;justify-content:center;padding:env(safe-area-inset-top,0) 0 0;z-index:5}
.sh{background:var(--card);width:min(960px,100%);margin:12px;border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sh>.hd{display:flex;justify-content:space-between;align-items:center;padding:12px;gap:8px}
.sh>.bd{flex:1;overflow:auto;padding:12px}.sh>.ft{padding:12px calc(12px + env(safe-area-inset-bottom,0))}
.sh>.ft button{width:100%;height:64px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid button{height:76px;border-radius:38px;line-height:1.2}.grid button.on{background:var(--ac);color:#fff}
.grid small{display:block;font-weight:400;opacity:.8}
pre{font:16px ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:0}
.ed{display:grid;grid-template-columns:70px 1.4fr 1fr 1.6fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.ee{display:grid;grid-template-columns:2fr 1fr auto;gap:6px;margin-bottom:6px}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:auto}.kr{display:flex;gap:6px}.kr button{flex:1;height:52px;border-radius:8px;font-size:24px;font-weight:600;padding:0}.kr .w{flex:4;font-size:19px;font-weight:400}.kr .rt{background:var(--ac);color:#fff;flex:2}.kn{max-width:440px;width:100%;margin:0 auto}.kn .kr button{height:64px;font-size:30px}.dsp{font-size:28px;font-weight:700;min-height:56px;padding:10px 12px;background:var(--in);border-radius:10px;margin:10px 0;overflow-wrap:anywhere}.sg{padding:12px;background:var(--in);border-radius:10px;margin-bottom:6px;cursor:pointer}.sg b{display:block;font-size:19px}
@media print{:root{--card:#fff;--fg:#000;--mut:#555}body>*:not(.ov){display:none}.ov{position:static;background:none}.sh>.hd,.sh>.ft{display:none}}
@media(max-width:800px){body{flex-direction:column;overflow:auto}#Rc{width:auto}.grid{grid-template-columns:1fr 1fr}.ed{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="Lc"><div id="sbar">🔍&nbsp; Nummer oder Name suchen</div>
 <div class="p" id="L"><div class="r"><b class="m" id="spk">Speisekarte</b></div><div class="chips" id="cats"></div><div id="list"></div></div></div>
<div id="Rc"><div class="r" style="justify-content:flex-end"><button class="s" id="bHist">Verlauf</button><button id="bRev">Umsatz</button></div>
 <div class="p" id="R">
 <b class="m" id="no"></b>
 <div id="lines" style="flex:1;overflow:auto"></div>
 <div class="r"><span class="sum">Summe</span><span class="sum" id="tot"></span></div>
 <div class="two"><button id="mA">Abholung</button><button id="mL">Lieferung</button></div>
 <div class="two"><button class="fb" id="f_name" data-f="name"></button><button class="fb" id="f_tel" data-f="tel"></button></div>
 <div id="addr" style="display:flex;flex-direction:column;gap:8px"><button class="fb" id="f_street" data-f="street"></button><button class="fb" id="f_city" data-f="city"></button></div>
 <div class="two"><button class="fb" id="f_floor" data-f="floor"></button><button class="fb" id="f_pay" data-f="pay"></button></div>
 <button class="fb" id="f_hint" data-f="hint"></button>
 <div class="two"><button id="bDone">Bestellung abschließen</button><button class="g" id="bBon">Bon anzeigen</button></div>
 </div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),h=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>n.toFixed(2).replace('.',',')+' €',num=n=>n.toFixed(2).replace('.',','),pn=s=>parseFloat(String(s).replace(',','.'))||0;
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const SAMPLE=`# Pizzen
101;Pizza Margherita;Klein=7,50|Mittel=9,00|Groß=11,50
102;Pizza Salami;Klein=8,50|Mittel=10,00|Groß=12,50
103;Pizza Schinken;Klein=8,50|Mittel=10,00|Groß=12,50
104;Pizza Funghi;Klein=8,50|Mittel=10,00|Groß=12,50
105;Pizza Hawaii;Klein=9,00|Mittel=10,50|Groß=13,00
300;Pizza Tonno;Klein=9,00|Mittel=10,50|Groß=13,00
# Nudelgerichte
201;Spaghetti Bolognese;9,00
202;Penne Arrabbiata;8,50
# Salate
301;Gemischter Salat;6,50
# Getränke
400;Cola;0,33 l=2,50|0,5 l=3,50|1 l=5,50;-
401;Wasser;0,33 l=2,00|0,75 l=3,50;-
402;Durstlöscher;0,5 l=3,00;-`;
const EXT=[["Extra Käse",1],["Oliven",1],["Champignons",1],["Salami",1],["Schinken",1],["Peperoni",.5],["Zwiebeln",.5],["Knoblauch",.5],["Ohne Zwiebeln",0],["Scharf",0]].map(([n,p])=>({n,p}));
function parse(t){let c="";return t.split("\n").map(l=>l.trim()).filter(Boolean).flatMap(l=>{if(l[0]=="#"){c=l.slice(1).trim();return[]}
 const p=l.split(";");if(p.length<3)return[];return[{cat:c,nr:p[0],name:p[1],opts:p[2].split("|").map(o=>{const i=o.lastIndexOf("=");return i<0?{l:"",p:pn(o)}:{l:o.slice(0,i),p:pn(o.slice(i+1))}}),ex:p[3]!="-"}]})}
const optStr=d=>d.opts.map(o=>(o.l?o.l+"=":"")+num(o.p)).join("|");
let menu=ld("menu",null)||parse(SAMPLE),extras=ld("extras",EXT),hist=ld("hist",[]),S=ld("order",null)||{lines:[],del:false,f:{}},cat="",ov=[];
const sameDay=(a,b)=>new Date(a).toDateString()==new Date(b).toDateString();
const today=()=>hist.filter(x=>sameDay(x.t,Date.now())).length;
const total=o=>o.lines.reduce((s,l)=>s+(l.price+l.ex.reduce((a,e)=>a+e.p,0))*l.qty,0);
const save=()=>{sv("order",S);sv("hist",hist)};
if(!S.lines.length)S.no=today()+1;S.no=S.no||today()+1;

function render(){
 const cs=[...new Set(menu.map(d=>d.cat))],q="";
 $("#cats").innerHTML=["Alle",...cs].map(c=>`<button class="s ${(cat||"Alle")==c?"on":""}" data-c="${h(c)}">${h(c||"Sonstiges")}</button>`).join("");
 let lc="";$("#list").innerHTML=menu.map((d,i)=>[d,i]).filter(([d])=>!cat||d.cat==cat).map(([d,i])=>{
  const n=S.lines.filter(l=>l.nr==d.nr).reduce((a,l)=>a+l.qty,0),hd=d.cat!=lc&&d.cat?`<div class="hdr">${h(d.cat)}</div>`:"";lc=d.cat;
  return hd+`<div class="d ${n?"sel":""}" data-i="${i}"><b>${h(d.nr)}</b><span>${h(d.name)}</span><span class="c">${n?"✓ "+n+"×":""}</span><span class="m">${d.opts.length>1?"ab ":""}${eur(Math.min(...d.opts.map(o=>o.p)))}</span></div>`}).join("");
 $("#no").textContent="Bestellung Nr. "+S.no;
 $("#lines").innerHTML=S.lines.map((l,i)=>{const dt=[...l.ex.map(e=>"+ "+e.n),l.note].filter(Boolean).join(", ");return `<div class="l"><div class="r"><div><div style="font-size:19px">${l.qty}× ${h(l.nr+" "+l.name+(l.size?" ("+l.size+")":""))}</div>${dt?`<div class="gr">${h(dt)}</div>`:""}<div class="m">${eur((l.price+l.ex.reduce((a,e)=>a+e.p,0))*l.qty)}</div></div>
  <span class="ic">${extras.length?`<button class="s g" data-e="${i}">Extras</button>`:""}<button class="s" data-q="${i}" data-d="-1">−</button><button class="s" data-q="${i}" data-d="1">+</button><button class="s" data-q="${i}" data-d="-999">🗑</button></span></div></div>`}).join("")||'<div class="m">Noch nichts bestellt.</div>';
 $("#tot").textContent=eur(total(S));
 $("#bBon").disabled=!S.lines.length;$("#bBon").style.opacity=S.lines.length?1:.4;$("#f_floor").style.display=S.del?"":"none";$("#f_pay").style.gridColumn=S.del?"":"1 / 3";
 $("#mA").className=S.del?"":"g";$("#mL").className=S.del?"g":"";$("#addr").style.display=S.del?"flex":"none";
 for(const k in FD){const b=$("#f_"+k);b.textContent=S.f[k]||FD[k][0];b.style.color=S.f[k]?"var(--fg)":"var(--mut)"}
 save();
}
function sheet(title,body,foot,cancel="Schließen"){
 const o=document.createElement("div");o.className="ov";
 o.innerHTML=`<div class="sh"><div class="hd"><button class="s" data-x>${cancel}</button><b>${h(title)}</b><span></span></div><div class="bd">${body}</div>${foot?`<div class="ft">${foot}</div>`:""}</div>`;
 o.querySelector("[data-x]").onclick=()=>{o.remove();ov=ov.filter(x=>x!=o)};document.body.append(o);ov.push(o);return o}
const close=o=>{o.remove();ov=ov.filter(x=>x!=o)};

function pick(d,q=1){
 if(d.opts.length>1){const o=sheet(d.name+": Größe wählen",`<div class="grid">${d.opts.map((x,i)=>`<button data-o="${i}">${h(x.l)}<small>${eur(x.p)}</small></button>`).join("")}</div>`,"","Abbrechen");
  o.onclick=e=>{const b=e.target.closest("[data-o]");if(b){close(o);step(d,d.opts[b.dataset.o],q)}}}
 else step(d,d.opts[0],q)}
function step(d,o,q=1){if(d.ex&&extras.length)extraSheet(`${q}× ${d.name}${o.l?" ("+o.l+")":""}`,[],"",(ex,n,one)=>{if(one&&q>1){add(d,o,ex,n,1);add(d,o,[],"",q-1)}else add(d,o,ex,n,q)},"Hinzufügen",q);else add(d,o,[],"",q)}
function add(d,o,ex,note,q=1){
 const k=a=>a.map(e=>e.n).sort().join("|"),f=S.lines.find(l=>l.nr==d.nr&&l.size==o.l&&k(l.ex)==k(ex)&&l.note==note);
 if(f)f.qty+=q;else S.lines.push({nr:d.nr,name:d.name,size:o.l,price:o.p,qty:q,ex,note});render()}
function extraSheet(title,ch,note,cb,label,qty=1){
 let sel=ch.map(e=>e.n),one=false;
 const o=sheet("Extras",`<h3 style="margin:0 0 12px">${h(title)}</h3>${qty>1?`<div class="chips" style="margin-bottom:12px"><button class="s on" data-one="0">Alle ${qty}×</button><button class="s" data-one="1">Nur 1×</button></div>`:""}<div class="grid">${extras.map((e,i)=>`<button data-i="${i}" class="${sel.includes(e.n)?"on":""}">${h(e.n)}<small>${e.p>0?"+ "+eur(e.p):"gratis"}</small></button>`).join("")}</div>`,`<button class="g" data-ok>${label}</button>`,"Abbrechen");
 o.onclick=e=>{const w=e.target.closest("[data-one]");if(w){one=w.dataset.one=="1";o.querySelectorAll("[data-one]").forEach(x=>x.classList.toggle("on",x==w))}const b=e.target.closest(".grid button");if(b){const n=extras[b.dataset.i].n;sel=sel.includes(n)?sel.filter(x=>x!=n):[...sel,n];b.classList.toggle("on")}
  if(e.target.closest("[data-ok]")){close(o);cb(extras.filter(x=>sel.includes(x.n)).map(x=>({n:x.n,p:x.p})),note,one)}}}

const stamp=t=>new Date(t).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const nrm=x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function bon(o,t=Date.now()){
 const w=32,row=(a,b)=>a.slice(0,w-b.length-1).padEnd(w-b.length)+b,f=o.f,d=new Date(t);
 const out=["Bestellung Nr. "+o.no,"Datum: "+stamp(t),o.del?"*** LIEFERUNG ***":"*** ABHOLUNG ***"];
 [f.name,f.tel].forEach(x=>x&&out.push(x));if(o.del){[f.street,f.city].forEach(x=>x&&out.push(x));f.floor&&out.push("Etage: "+f.floor)}
 f.pay&&out.push("Zahlart: "+f.pay);f.hint&&out.push("Hinweis: "+f.hint);out.push("-".repeat(w));
 o.lines.forEach(l=>{out.push(row(`${l.qty}x ${l.nr} ${l.name}${l.size?" ("+l.size+")":""}`,num((l.price+l.ex.reduce((a,e)=>a+e.p,0))*l.qty)));
  l.ex.forEach(e=>out.push("   + "+e.n+(e.p>0?" ("+num(e.p)+")":"")));l.note&&out.push("   > "+l.note)});
 out.push("-".repeat(w),row("Summe EUR",num(total(o))));return out.join("\n")}
function qrSvg(o){const f=o.f;if(!o.del||!(f.street||"").trim()||typeof qrcode=="undefined")return"";
 try{const q=qrcode(0,"M");q.addData("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([f.street,f.city].filter(Boolean).join(", ")));q.make();
 return `<div style="text-align:center;margin-top:16px"><div style="display:inline-block;background:#fff;padding:8px;line-height:0">${q.createSvgTag({cellSize:5,margin:0})}</div><div class="m">Adresse scannen</div></div>`}catch(e){return""}}
const showBon=(o,t)=>{const s=sheet("Bon",`<pre>${h(bon(o,t))}</pre>${qrSvg(o)}`,`<button class="g" onclick="print()">Drucken</button>`)};

const bonRow=x=>`<div class="d" data-b="${hist.indexOf(x)}"><div><b style="width:auto;display:block">${stamp(x.t)}</b><span class="m">Nr. ${x.o.no}, ${x.o.del?"Lieferung":"Abholung"}${x.o.f.name?", "+h(x.o.f.name):""}</span></div><span class="ic"><b style="width:auto">${eur(total(x.o))}</b><button class="s" data-del="${hist.indexOf(x)}">✕</button></span></div>`;
const sum=L=>L.reduce((a,x)=>a+total(x.o),0),ln=(a,b,big)=>`<div class="r" style="padding:${big?6:2}px 0;font-size:${big?28:19}px;${big?"font-weight:800":""}"><span>${a}</span><b>${b}</b></div>`;
function bonClick(e,redraw){const dl=e.target.closest("[data-del]"),b=e.target.closest("[data-b]");
 if(dl){if(confirm("Diese Bestellung löschen?")){hist.splice(+dl.dataset.del,1);if(!S.lines.length)S.no=today()+1;save();render();redraw()}return}
 if(b){const x=hist[b.dataset.b];showBon(x.o,x.t)}}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7)}
function revenue(){
 let per="Tag",off=0;const o=sheet("Umsatz","","","Fertig"),bd=o.querySelector(".bd");
 const range=()=>{const n=new Date();let a,b;
  if(per=="Tag"){a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-off);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+1)}
  if(per=="Woche"){const dw=(n.getDay()+6)%7;a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dw-7*off);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+7)}
  if(per=="Monat"){a=new Date(n.getFullYear(),n.getMonth()-off,1);b=new Date(a.getFullYear(),a.getMonth()+1,1)}
  if(per=="Jahr"){a=new Date(n.getFullYear()-off,0,1);b=new Date(a.getFullYear()+1,0,1)}return[a,b]};
 const draw=()=>{const[a,b]=range(),e=new Date(b-1),L=hist.filter(x=>x.t>=a&&x.t<b),f=d=>d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}),fy=d=>d.toLocaleDateString("de-DE");
  const lab=per=="Tag"?(off?"":"Heute · ")+a.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"}):per=="Woche"?`KW ${isoWeek(a)} · ${f(a)}. – ${fy(e)}`:per=="Monat"?a.toLocaleDateString("de-DE",{month:"long",year:"numeric"}):String(a.getFullYear());
  const P=L.filter(x=>!x.o.del),D=L.filter(x=>x.o.del),pm={};L.forEach(x=>{const k=(x.o.f.pay||"").trim()||"Ohne Angabe";pm[k]=pm[k]||[];pm[k].push(x)});
  bd.innerHTML=`<div class="chips" style="margin-bottom:12px">${["Tag","Woche","Monat","Jahr"].map(p=>`<button class="s ${p==per?"on":""}" style="flex:1" data-p="${p}">${p}</button>`).join("")}</div>
  <div class="r" style="margin-bottom:14px"><button class="s" data-n="1">‹</button><b style="text-align:center">${lab}</b><button class="s" data-n="-1" ${off?"":"disabled style='opacity:.3'"}>›</button></div>
  <div class="m" style="margin:8px 0">ZUSAMMENFASSUNG</div>${ln("Umsatz",eur(sum(L)),1)}${ln("Bestellungen",L.length)}${ln("Ø pro Bestellung",eur(L.length?sum(L)/L.length:0))}${ln(`Abholung (${P.length})`,eur(sum(P)))}${ln(`Lieferung (${D.length})`,eur(sum(D)))}
  ${Object.entries(pm).sort((x,y)=>sum(y[1])-sum(x[1])).map(([k,v])=>ln(`Zahlart ${h(k)} (${v.length})`,eur(sum(v)))).join("")}
  <div class="m" style="margin:16px 0 4px">BONS (${L.length})</div>${L.map(bonRow).join("")||'<div class="m">Keine Bestellungen in diesem Zeitraum.</div>'}`};
 o.onclick=e=>{const p=e.target.closest("[data-p]"),n=e.target.closest("[data-n]");
  if(p){per=p.dataset.p;off=0;draw()}else if(n){off=Math.max(0,off+ +n.dataset.n);draw()}else bonClick(e,draw)};draw()}
function editor(){
 let tab=0;const o=sheet("Bearbeiten","","","Fertig");const bd=o.querySelector(".bd");
 const draw=()=>{bd.innerHTML=`<div class="chips" style="margin-bottom:12px"><button class="s ${tab==0?"on":""}" data-t="0">Speisekarte</button><button class="s ${tab==1?"on":""}" data-t="1">Extras</button><button class="s" data-t="2">Sichern / Laden</button></div>`+
  (tab==0?`<div class="m" style="margin-bottom:8px">Nr · Name · Gruppe · Preise (Größe=Preis, mehrere mit |, z. B. Klein=7,50|Groß=11,50) · Extras</div>`+
   menu.map((d,i)=>`<div class="ed"><input data-m="${i}" data-k="nr" value="${h(d.nr)}"><input data-m="${i}" data-k="name" value="${h(d.name)}"><input data-m="${i}" data-k="cat" value="${h(d.cat)}"><input data-m="${i}" data-k="opts" value="${h(optStr(d))}"><label class="m"><input type="checkbox" style="width:auto" data-m="${i}" data-k="ex" ${d.ex?"checked":""}> Extras</label><button class="s" data-dm="${i}">✕</button></div>`).join("")+`<button class="g" data-am>+ Gericht hinzufügen</button>`
  :tab==1?extras.map((e,i)=>`<div class="ee"><input data-x="${i}" data-k="n" value="${h(e.n)}"><input data-x="${i}" data-k="p" value="${num(e.p)}" inputmode="decimal"><button class="s" data-dx="${i}">✕</button></div>`).join("")+`<button class="g" data-ax>+ Extra hinzufügen</button>`
  :`<div class="m">Zum Sichern den Text kopieren und aufbewahren. Zum Laden einfügen und auf „Laden“ tippen.</div><textarea id="bk" rows="10" style="margin:8px 0">${h(JSON.stringify({menu,extras}))}</textarea><button class="g" data-ld>Laden</button> <button data-rs>Beispielkarte laden</button>`)};
 o.onclick=e=>{const g=s=>e.target.closest(s);
  if(g("[data-t]")){tab=+g("[data-t]").dataset.t}
  else if(g("[data-dm]")){menu.splice(g("[data-dm]").dataset.dm,1)}
  else if(g("[data-am]")){menu.push({cat:menu.length?menu[menu.length-1].cat:"",nr:"",name:"",opts:[{l:"",p:0}],ex:true})}
  else if(g("[data-dx]")){extras.splice(g("[data-dx]").dataset.dx,1)}
  else if(g("[data-ax]")){extras.push({n:"",p:0})}
  else if(g("[data-ld]")){try{const j=JSON.parse($("#bk").value);menu=j.menu;extras=j.extras}catch(x){alert("Das hat nicht geklappt.");return}}
  else if(g("[data-rs]")){if(confirm("Aktuelle Karte durch die Beispielkarte ersetzen?"))menu=parse(SAMPLE);else return}
  else return;sv("menu",menu);sv("extras",extras);draw();render()};
 o.onchange=e=>{const t=e.target,k=t.dataset.k;if(t.dataset.m!=null){const d=menu[t.dataset.m];
   if(k=="opts")d.opts=t.value.split("|").map(s=>{const i=s.lastIndexOf("=");return i<0?{l:"",p:pn(s)}:{l:s.slice(0,i).trim(),p:pn(s.slice(i+1))}});
   else if(k=="ex")d.ex=t.checked;else d[k]=t.value.trim()}
  else if(t.dataset.x!=null){const x=extras[t.dataset.x];x[k]=k=="p"?pn(t.value):t.value.trim()}
  else return;sv("menu",menu);sv("extras",extras);render()};
 draw()}

$("#cats").onclick=e=>{const b=e.target.closest("[data-c]");if(b){cat=b.dataset.c=="Alle"?"":b.dataset.c;render()}};
$("#list").onclick=e=>{const d=e.target.closest(".d");if(d)pick(menu[d.dataset.i])};
$("#lines").onclick=e=>{const q=e.target.closest("[data-q]"),x=e.target.closest("[data-e]");
 if(q){const l=S.lines[q.dataset.q];l.qty+=+q.dataset.d;if(l.qty<1)S.lines.splice(q.dataset.q,1);render()}
 if(x){const l=S.lines[x.dataset.e];extraSheet(`${l.qty}× ${l.name}${l.size?" ("+l.size+")":""}`,l.ex,l.note,(ex,n,one)=>{if(one&&l.qty>1){l.qty--;S.lines.splice(+x.dataset.e+1,0,{...l,qty:1,ex,note:n})}else{l.ex=ex;l.note=n}render()},"Speichern",l.qty)}};
$("#mA").onclick=()=>{S.del=false;render()};$("#mL").onclick=()=>{S.del=true;render()};
const FD={name:["Name","Name"],tel:["Telefon","Telefon"],street:["Straße und Hausnummer","Straße"],city:["PLZ und Ort","Ort"],floor:["Etage","Etage"],pay:["Zahlart","Zahlart"],hint:["Hinweis (z. B. Klingel)","Hinweis"]};
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>fieldEditor(b.dataset.f));
function fieldEditor(k){
 let caps=false,sug=[],tm,tk=0;
 const o=sheet("Bestellung","","","Fertig"),bd=o.querySelector(".bd");bd.style.cssText+="display:flex;flex-direction:column";
 const ks=()=>S.del?["name","tel","street","city","floor","pay","hint"]:["name","tel","pay","hint"];
 const nxt=()=>ks()[ks().indexOf(k)+1];
 const up=()=>{const v=S.f[k]||"";return caps||(k!="tel"&&k!="floor"&&(!v||v.endsWith(" ")))};
 const kk=(c,cl="")=>{const t=c.length==1&&c!="ß"&&up()?c.toUpperCase():c;return `<button class="${cl}" data-k="${h(t)}">${h(t)}</button>`};
 const row=l=>`<div class="kr">${[...l].map(c=>kk(c)).join("")}</div>`;
 const rt=`<button class="rt" data-ret>${nxt()?"Weiter":"Fertig"}</button>`,bs='<button data-bs>⌫</button>';
 function draw(){const v=S.f[k]||"";const numeric=k=="tel"||k=="floor";
  let mid="";
  if(k=="street")mid=sug.length?sug.map((x,i)=>`<div class="sg" data-g="${i}"><b>${h(x.road)}</b><span class="m">${h(x.sub)}</span></div>`).join(""):'<div class="m" style="margin-bottom:10px">Anfang der Straße tippen, Vorschlag wählen, dann Hausnummer ergänzen.</div>';
  if(k=="pay")mid=`<div class="grid" style="margin-top:8px">${["Bar","Karte","PayPal"].map(z=>`<button data-z="${z}" class="${v==z?"on":""}">${z}</button>`).join("")}</div>`;
  const kb=k=="pay"?"":numeric?`<div class="kb kn">${row("123")}${row("456")}${row("789")}<div class="kr">${k=="tel"?kk("+"):"<span style='flex:1'></span>"}${kk("0")}${bs}</div><div class="kr">${rt}</div></div>`
   :`<div class="kb">${row("1234567890")}${row("qwertzuiopü")}${row("asdfghjklöä")}<div class="kr"><button data-sh style="${caps?"background:#0a84ff;color:#fff":""}">⇧</button>${[..."yxcvbnmß"].map(c=>kk(c)).join("")}${bs}</div><div class="kr">${kk("-")}${kk(".")}${kk(",")}${kk("/")}<button class="w" data-k=" ">Leerzeichen</button>${rt}</div></div>`;
  bd.innerHTML=`<div class="chips" style="flex-wrap:nowrap">${ks().map(f=>`<button class="s ${f==k?"on":""}" style="flex:1" data-t="${f}">${FD[f][1]}</button>`).join("")}</div><div class="dsp" style="${v?"":"color:var(--mut)"}">${v?h(v)+"▏":FD[k][0]}</div>${mid}${kb}`}
 function look(){clearTimeout(tm);const v=S.f.street||"";if(k!="street"||v.trim().length<2||/\d/.test(v)||v.endsWith(" ")){sug=[];return}
  const city=(S.f.city||"").replace(/\d/g,"").trim(),me=++tk;
  tm=setTimeout(async()=>{try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=10&countrycodes=de&accept-language=de&q="+encodeURIComponent(v+(city?" "+city:"")));const j=await r.json();if(me!=tk)return;const seen={};
   sug=j.filter(x=>x.address&&x.address.road).map(x=>{const a=x.address,c=a.city||a.town||a.village||a.municipality||"";return{road:a.road,city:c,pc:a.postcode||"",sub:[a.postcode,c].filter(Boolean).join(" ")}}).filter(x=>{const q=x.road+x.city;return seen[q]?false:seen[q]=1}).slice(0,6);draw()}catch(e){}},400)}
 o.onclick=e=>{const g=s=>e.target.closest(s);let c;
  if(c=g("[data-t]")){k=c.dataset.t;sug=[];look()}
  else if(c=g("[data-k]")){S.f[k]=(S.f[k]||"")+c.dataset.k;caps=false;look()}
  else if(g("[data-bs]")){S.f[k]=(S.f[k]||"").slice(0,-1);look()}
  else if(g("[data-sh]"))caps=!caps;
  else if(c=g("[data-g]")){const x=sug[c.dataset.g];S.f.street=x.road+" ";if(x.city)S.f.city=[x.pc,x.city].filter(Boolean).join(" ");sug=[]}
  else if(c=g("[data-z]")){S.f.pay=c.dataset.z;const n=nxt();if(n)k=n;else{close(o);render();return}}
  else if(g("[data-ret]")){const n=nxt();if(n){k=n;sug=[]}else{close(o);render();return}}
  else return;render();draw()};
 const cl=o.querySelector("[data-x]");cl.addEventListener("click",render);draw()}
$("#sbar").onclick=()=>{let buf="",qty=1,err=false,caps=false;const o=sheet("Suche","","","Abbrechen"),bd=o.querySelector(".bd");
 const M=d=>{const q=buf.trim();if(!q)return false;if(/^\d+$/.test(q))return d.nr.startsWith(q);const w=d.name.split(" ");return q.split(/\s+/).every(t=>w.some(x=>nrm(x).startsWith(nrm(t))))};
 const F=()=>menu.filter(M),cur=()=>{const f=F(),q=buf.trim();return q?(f.find(d=>d.nr==q)||(f.length==1?f[0]:null)):null};
 const go=d=>{close(o);setTimeout(()=>pick(d,qty),50)};
 const K=(c,cl="")=>{const t=c.length==1&&c!="ß"&&caps?c.toUpperCase():c;return `<button class="${cl}" data-k="${h(t)}">${h(t)}</button>`},R=l=>`<div class="kr">${[...l].map(c=>K(c)).join("")}</div>`,bs='<button data-bs>⌫</button>',ok='<button class="rt" data-ok>OK</button>';
 function draw(){const f=F(),c=cur(),q=buf.trim();
  const sg=err?'<div style="color:#ff453a">Nicht eindeutig oder nicht gefunden</div>':!q?'<div class="m">Nummer tippen oder Namen beginnen</div>':!f.length?'<div class="m">Nichts gefunden</div>':f.slice(0,4).map(d=>`<div class="d" data-s="${d.nr}" style="border-radius:10px;margin-bottom:6px;border:0;background:${c&&c.nr==d.nr?"rgba(52,199,89,.25)":"var(--in)"}"><span><b>${h(d.nr)}</b>${h(d.name)}</span><span class="m">${d.opts.length>1?"ab ":""}${eur(Math.min(...d.opts.map(x=>x.p)))}</span></div>`).join("")+(f.length>4?`<div class="m">… ${f.length-4} weitere, weiter tippen</div>`:"");
  bd.innerHTML=`<div class="r" style="gap:14px"><div class="dsp" style="flex:1;margin:0;${buf?"":"color:var(--mut)"}">${buf?h(buf):"Nummer oder Name"}</div><span class="ic"><button class="s" data-qm>−</button><b style="font-size:22px;min-width:52px;text-align:center">${qty}×</b><button class="s" data-qp>+</button></span></div>
  <div style="height:230px;margin:12px 0;overflow:hidden">${sg}</div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-top:auto"><div class="kb kn" style="flex:1;min-width:300px">${R("123")}${R("456")}${R("789")}<div class="kr">${ok}${K("0")}${bs}</div></div>
  <div class="kb" style="flex:2;min-width:440px">${R("qwertzuiopü")}${R("asdfghjklöä")}<div class="kr"><button data-sh style="${caps?"background:#0a84ff;color:#fff":""}">⇧</button>${[..."yxcvbnmß"].map(x=>K(x)).join("")}${bs}</div><div class="kr">${K("-")}${K(".")}${K(",")}${K("/")}<button class="w" data-k=" ">Leerzeichen</button>${ok}</div></div></div>`}
 bd.style.cssText+="display:flex;flex-direction:column";
 o.onclick=e=>{const g=x=>e.target.closest(x);let c;err=false;
  if(c=g("[data-k]")){buf+=c.dataset.k;caps=false}else if(g("[data-bs]"))buf=buf.slice(0,-1);else if(g("[data-sh]"))caps=!caps;
  else if(g("[data-qm]"))qty=Math.max(1,qty-1);else if(g("[data-qp]"))qty=Math.min(20,qty+1);
  else if(c=g("[data-s]")){go(menu.find(d=>d.nr==c.dataset.s));return}
  else if(g("[data-ok]")){if(buf.trim()){const d=cur();if(d){go(d);return}err=true}}else return;draw()};
 draw()};
$("#bHist").onclick=()=>{const o=sheet("Verlauf","","","Fertig"),bd=o.querySelector(".bd"),dr=()=>{const T=hist.filter(x=>sameDay(x.t,Date.now()));bd.innerHTML=`<div class="r" style="font-weight:700;font-size:19px;margin-bottom:8px"><span>Heute: ${T.length} Bestellungen</span><b>${eur(sum(T))}</b></div>`+(hist.slice(0,300).map(bonRow).join("")||'<div class="m">Noch keine abgeschlossenen Bestellungen.</div>')};o.onclick=e=>bonClick(e,dr);dr()};
let pt;$("#spk").onpointerdown=()=>{pt=setTimeout(editor,1000)};$("#spk").onpointerup=$("#spk").onpointerleave=()=>clearTimeout(pt);
$("#bBon").onclick=()=>showBon(S);$("#bRev").onclick=revenue;

 const m=S.del;S={lines:[],del:m,f:{},no:today()+1};render()};

render();
