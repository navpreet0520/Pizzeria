<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const app=initializeApp({apiKey:"AIzaSyAVzQHLMWFgHs50E-eahQ052F2pvHoZeYg",authDomain:"pizzeria-bregenzer.firebaseapp.com",projectId:"pizzeria-bregenzer",storageBucket:"pizzeria-bregenzer.firebasestorage.app",messagingSenderId:"1024829646459",appId:"1:1024829646459:web:1fbbc1133cfeef2e9564de"});
const auth=getAuth(app);let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(app)}
let nobon=new Set(),known=new Map(),unsubs=[],first=true,ready=false,cfgKnown="",pt;

 cur.forEach((j,t)=>{if(known.get(t)!==j||nobon.has(t)){known.set(t,j);nobon.delete(t);let b="";try{const x=hist.find(y=>y.t==t);b=bon(x.o,x.t)}catch(e){}setDoc(doc(db,"orders",String(t)),{t,json:j,bon:b}).catch(err)}});
 [...known.keys()].forEach(t=>{if(!cur.has(t)){known.delete(t);deleteDoc(doc(db,"orders",String(t))).catch(err)}})}
function pushCfg(){if(!auth.currentUser)return;const d={menu:JSON.stringify(menu),extras:JSON.stringify(extras),t:Date.now()},j=d.menu+"|"+d.extras;if(j===cfgKnown)return;cfgKnown=j;setDoc(doc(db,"config","main"),d).catch(err)}
window.syncPush=()=>{clearTimeout(pt);pt=setTimeout(push,300)};window.syncCfg=pushCfg;
function start(){first=true;ready=false;
 unsubs.push(onSnapshot(doc(db,"config","main"),s=>{if(s.exists()){const d=s.data(),j=d.menu+"|"+d.extras;if(j!==cfgKnown){cfgKnown=j;applyRemote({menu:JSON.parse(d.menu),extras:JSON.parse(d.extras)},null)}}else if(!s.metadata.fromCache)pushCfg()},err));
 unsubs.push(onSnapshot(collection(db,"orders"),s=>{const m=new Map();nobon=new Set();s.forEach(x=>{const d=x.data();m.set(d.t,d.json);if(d.bon===undefined)nobon.add(d.t)});known=m;
  let l=[...m.values()].map(j=>JSON.parse(j));if(first){first=false;l=l.concat(hist.filter(x=>!m.has(x.t)))}
  l.sort((a,b)=>b.t-a.t);applyRemote(null,l);ready=true;push();st("☁ verbunden")},err))}
function stop(){unsubs.forEach(u=>u());unsubs=[];ready=false;known=new Map();cfgKnown=""}
let skip=false;
onAuthStateChanged(auth,u=>{if(u){$("#lg").style.display="none";st("☁ verbinde …");start()}else{stop();st("☁ lokal");if(!skip)$("#lg").style.display="flex"}});

$("#lgSkip").onclick=()=>{skip=true;$("#lg").style.display="none"};
$("#cl").onclick=()=>{if(auth.currentUser){if(confirm("Abmelden? Die App arbeitet dann nur lokal."))signOut(auth)}else{skip=false;$("#lg").style.display="flex"}};
</script>
